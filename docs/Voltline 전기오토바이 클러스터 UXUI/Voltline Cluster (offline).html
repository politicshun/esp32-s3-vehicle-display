document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

sunken:var(--ink-950);\n  --surface-inverse:var(--ink-050);\n  --surface-accent:var(--current-700);\n\n  --text-primary:var(--ink-050);\n  --text-secondary:var(--ink-300);\n  --text-tertiary:var(--ink-400);\n  --text-disabled:var(--ink-500);\n  --text-accent:var(--current-500);\n  --text-inverse:var(--ink-950);\n  --text-critical:var(--signal-critical);\n\n  --line-hairline:var(--ink-700);\n  --line-default:var(--ink-600);\n  --line-strong:var(--ink-500);\n  --line-accent:var(--current-600);\n\n  --track-empty:var(--ink-700);\n  --track-fill:var(--current-500);\n\n  --focus-ring:var(--current-400);\n  --scrim:rgba(4,7,10,.72);\n}\n\n/* Day scope: direct-sunlight legibility. Applied to a root container, never mixed mid-screen. */\n[data-theme=\"day\"]{\n  --bg-void:#E7ECEF;\n  --surface-base:#F3F6F7;\n  --surface-panel:#FFFFFF;\n  --surface-raised:#FFFFFF;\n  --surface-sunken:#DFE6E9;\n  --surface-inverse:var(--ink-900);\n  --surface-accent:var(--current-300);\n\n  --text-primary:#0A0E12;\n  --text-secondary:#40525C;\n  --text-tertiary:#5E7079;\n  --text-disabled:#9AA8B0;\n  --text-accent:#00776C;\n  --text-inverse:#FFFFFF;\n\n  --line-hairline:#D3DCE0;\n  --line-default:#B9C5CB;\n  --line-strong:#8A9AA3;\n  --line-accent:#00857A;\n\n  --track-empty:#CBD5D9;\n  --track-fill:#00857A;\n  --scrim:rgba(20,28,33,.55);\n}\n<\u002Fstyle>\n<style>:root{\n  --font-core:\"Archivo\",\"Helvetica Neue\",Arial,sans-serif;        /* labels, UI, prose */\n  --font-readout:\"Barlow Semi Condensed\",\"Archivo\",sans-serif;    /* numerals at glance size */\n  --font-mono:\"JetBrains Mono\",ui-monospace,SFMono-Regular,monospace; /* diagnostics, codes, VIN */\n\n  /* Readouts — glanceable numerals. Always tabular. */\n  --type-speed-xl:180px;\n  --type-speed:132px;\n  --type-readout-1:76px;\n  --type-readout-2:52px;\n  --type-readout-3:38px;\n\n  /* UI text */\n  --type-title:24px;\n  --type-body-lg:18px;\n  --type-body:15px;\n  --type-label:13px;\n  --type-caption:11px;\n  --type-micro:10px;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n  --weight-bold:700;\n\n  --leading-readout:0.86;\n  --leading-tight:1.15;\n  --leading-body:1.5;\n\n  --tracking-readout:-0.02em;\n  --tracking-normal:0em;\n  --tracking-label:0.08em;   /* uppercase unit + field labels */\n  --tracking-micro:0.14em;\n\n  --numeric-tabular:tabular-nums lining-nums; /* @kind other */\n}\n<\u002Fstyle>\n<style>:root{\n  --space-0:0px; --space-1:2px; --space-2:4px; --space-3:8px; --space-4:12px;\n  --space-5:16px; --space-6:20px; --space-7:24px; --space-8:32px; --space-9:40px;\n  --space-10:48px; --space-11:64px; --space-12:80px;\n\n  /* Layout */\n  --gutter-cluster:24px;   /* landscape cluster safe padding */\n  --gutter-app:20px;       /* phone app screen padding */\n  --gap-tile:12px;\n  --gap-section:24px;\n  --hit-min:44px;          /* absolute minimum; gloved use targets 56px */\n  --hit-gloved:56px;\n  --bar-status:44px;\n  --bar-tab:64px;\n}\n<\u002Fstyle>\n<style>:root{\n  --radius-none:0px;\n  --radius-chip:6px;\n  --radius-control:10px;\n  --radius-tile:14px;\n  --radius-panel:20px;\n  --radius-screen:28px;\n  --radius-pill:999px;\n\n  --border-hairline:1px;\n  --border-default:1px;\n  --border-emphasis:2px;\n  --ring-focus:2px;\n\n  /* Elevation is light, not drop-shadow: cockpit surfaces glow, they don't float. */\n  --shadow-none:none;\n  --shadow-tile:inset 0 1px 0 rgba(255,255,255,.04);\n  --shadow-panel:0 1px 0 rgba(255,255,255,.05) inset, 0 8px 24px rgba(0,0,0,.45);\n  --shadow-modal:0 24px 64px rgba(0,0,0,.65);\n  --glow-accent:0 0 24px rgba(0,229,208,.28);\n  --glow-critical:0 0 24px rgba(255,68,56,.35);\n  --glow-caution:0 0 20px rgba(255,176,32,.30);\n\n  --blur-scrim:12px;\n}\n<\u002Fstyle>\n<style>:root{\n  --dur-instant:80ms; /* @kind other */    /* telltale on/off, press feedback */\n  --dur-fast:140ms; /* @kind other */      /* hover, chip select */\n  --dur-base:220ms; /* @kind other */      /* panel + sheet transitions */\n  --dur-slow:400ms; /* @kind other */      /* mode change, screen swap */\n  --dur-sweep:900ms; /* @kind other */     /* power-on needle/arc sweep */\n\n  --ease-standard:cubic-bezier(.2,0,0,1); /* @kind other */\n  --ease-exit:cubic-bezier(.4,0,1,1); /* @kind other */\n  --ease-enter:cubic-bezier(0,0,.2,1); /* @kind other */\n  --ease-readout:cubic-bezier(.33,1,.68,1); /* @kind other */ /* numeric counters settle, never bounce */\n\n  --pulse-warning:1200ms; /* @kind other */ /* caution telltale blink period */\n  --pulse-turn:800ms; /* @kind other */     /* turn-indicator blink period */\n}\n<\u002Fstyle>\n<style>*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;background:var(--bg-void);color:var(--text-primary);font-family:var(--font-core);font-size:var(--type-body);line-height:var(--leading-body);-webkit-font-smoothing:antialiased}\na{color:var(--text-accent);text-decoration:none}\na:hover{color:var(--current-300)}\n:focus-visible{outline:var(--ring-focus) solid var(--focus-ring);outline-offset:2px}\n<\u002Fstyle>\n<style>/* Voltline Cluster Design System — global entry. Imports only. */\n/* Webfonts. NOTE: served from Google Fonts CDN — no binaries are vendored in this project.\n   Substitution flagged in readme.md; swap these for licensed brand binaries when available. */\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"3c31d109-75cc-4d78-a8f1-8aea1dc7d7da\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"183d3d5f-fcf3-416c-a898-010149708ae4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD- lv_obj<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);color:var(--text-secondary)\">Discrete cells around a fixed zero: regen green to the left, power cyan to the right. Recolor only the cells that change.<\u002Fdiv>\n\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline)\">Battery cells<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);font-family:var(--font-mono);color:var(--current-400)\">10 × lv_obj<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);color:var(--text-secondary)\">Inside a 1 px bordered shell, like a physical fuel gauge. Off state uses the day/night track colour.<\u002Fdiv>\n\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline)\">Telltale rail<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);font-family:var(--font-mono);color:var(--current-400)\">lv_image + recolor<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);color:var(--text-secondary)\">1-bit alpha glyphs, off = 18% opacity, never hidden. Turn blink: lv_timer 800 ms, steps(1).<\u002Fdiv>\n\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline)\">Status row<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);font-family:var(--font-mono);color:var(--current-400)\">lv_flex row<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);color:var(--text-secondary)\">Persistent across all tiles: pack V, motor, controller, temp check, DTC count, READY. Never moves.<\u002Fdiv>\n\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline)\">Motion budget<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);font-family:var(--font-mono);color:var(--current-400)\">lv_anim<\u002Fdiv>\n          <div style=\"padding:8px 10px;border-bottom:1px solid var(--line-hairline);color:var(--text-secondary)\">Full: 250 ms cell recolor, speed glow fade, 300 ms tile slide. Lite: values snap, glow off, tiles cut. One build flag.<\u002Fdiv>\n\n          <div style=\"padding:8px 10px\">Safe area<\u002Fdiv>\n          <div style=\"padding:8px 10px;font-family:var(--font-mono);color:var(--current-400)\">8 px padding<\u002Fdiv>\n          <div style=\"padding:8px 10px;color:var(--text-secondary)\">All around, per the reference guide — nothing critical inside the bezel radius. Hit targets 56 px on 5\", 48 px on 7\".<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1260,&quot;height&quot;:1120},&quot;preset&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;5&quot;,&quot;7&quot;],&quot;default&quot;:&quot;5&quot;,&quot;tsType&quot;:&quot;'5'|'7'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;themeMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;night&quot;,&quot;day&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'night'|'day'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;units&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;metric&quot;,&quot;imperial&quot;],&quot;default&quot;:&quot;metric&quot;,&quot;tsType&quot;:&quot;'metric'|'imperial'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;lite&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;'full'|'lite'&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;fault&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;charging&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;},&quot;showLvglMap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Demo&quot;}}\">\nconst VIEWS = ['ride', 'trip', 'dtc', 'setup'];\n\n// Telltale lamp state: off is dimmed to 18%, never hidden. Blink is the legal 800ms hard step.\nfunction lampState(active, rgb, blink) {\n  return {\n    o: active ? '1' : '0.18',\n    f: active ? 'drop-shadow(0 0 10px rgba(' + rgb + ',.85))' : 'none',\n    a: active && blink ? 'voltline-blink var(--pulse-turn) steps(1,end) infinite' : 'none',\n  };\n}\n\nclass Component extends DCLogic {\n  state = {\n    view: 'ride', preset: '5', themeMode: 'auto', units: 'metric',\n    mode: 'city', speed: 72, watts: 12000, soc: 78, tripKm: 48.6, motorTemp: 54, ctrlTemp: 48,\n    sim: true, fault: false, charging: false, ble: true, brightness: 70, regen: 2,\n    autoTheme: true, autoLight: true, blinker: 'off', t: 0, motion: 'full',\n  };\n\n  componentDidMount() {\n    const p = this.props, seed = {};\n    ['preset', 'themeMode', 'units', 'fault', 'charging', 'motion'].forEach((k) => { if (p[k] !== undefined) seed[k] = p[k]; });\n    if (Object.keys(seed).length) this.setState(seed);\n    this.timer = setInterval(() => {\n      this.setState((s) => {\n        const t = s.t + 1;\n        const next = { t, blinker: t % 48 < 12 ? 'right' : 'off' };\n        if (s.charging) {\n          next.soc = Math.min(100, s.soc + 0.04);\n          next.speed = 0; next.watts = 0;\n          return next;\n        }\n        if (s.sim) {\n          const target = 46 + 30 * Math.sin(t / 44) + 8 * Math.sin(t / 10);\n          const sp = Math.max(0, s.speed + (target - s.speed) * 0.14);\n          const accel = (sp - s.speed) * 2;\n          next.speed = sp;\n          next.watts = Math.round(Math.max(-3000, Math.min(14000, accel * 3200 + sp * 92 - (accel < -0.2 ? 3400 : 0))));\n          next.soc = Math.max(4, s.soc - 0.006);\n          next.tripKm = s.tripKm + sp / 3600 * 0.25;\n          next.motorTemp = Math.round(Math.max(44, Math.min(112, s.motorTemp + (next.watts > 9000 ? 0.14 : -0.08))));\n          next.ctrlTemp = Math.round(Math.max(38, Math.min(96, s.ctrlTemp + (next.watts > 9000 ? 0.1 : -0.06))));\n        }\n        return next;\n      });\n    }, 250);\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n\n  set = (k) => (v) => this.setState({ [k]: v });\n  goRide = () => this.setState({ view: 'ride' });\n  goTrip = () => this.setState({ view: 'trip' });\n  goDtc = () => this.setState({ view: 'dtc' });\n  goSetup = () => this.setState({ view: 'setup' });\n\n  page(dir) {\n    this.setState((s) => {\n      if (s.charging) return {};\n      const i = VIEWS.indexOf(s.view);\n      return { view: VIEWS[Math.max(0, Math.min(VIEWS.length - 1, i + dir))] };\n    });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const metric = s.units === 'metric';\n    const fault = s.fault;\n    const soc = Math.round(s.soc);\n    const rangeKm = Math.round(soc * 1.62 * (fault ? 0.82 : 1));\n    const now = new Date();\n    const hour = now.getHours();\n    const theme = s.themeMode === 'auto' ? (hour >= 7 && hour < 19 ? 'day' : 'night') : s.themeMode;\n    const five = s.preset === '5';\n    const full = s.motion === 'full';\n    const view = s.charging ? 'charge' : s.view;\n    const toMi = (v) => v * 0.6214;\n    const shown = metric ? s.speed : toMi(s.speed);\n    const tempWarn = s.motorTemp > 95 || fault;\n\n    const CELLS = 40, ZERO = 20;\n    const kw = s.watts / 1000;\n    const regenCells = Math.round(Math.min(1, Math.max(0, -kw) / 3) * ZERO);\n    const powerCells = Math.round(Math.min(1, Math.max(0, kw) / 14) * (CELLS - ZERO));\n    const flowCells = [];\n    for (let i = 0; i < ZERO; i++) {\n      const from = ZERO - i;\n      flowCells.push({ f: 1, c: from <= regenCells ? 'var(--energy-regen)' : 'var(--track-empty)' });\n    }\n    flowCells.push({ f: 0.5, c: 'var(--text-primary)' });\n    for (let i = 1; i <= CELLS - ZERO; i++) {\n      flowCells.push({ f: 1, c: i <= powerCells ? 'var(--signal-caution)' : 'var(--track-empty)' });\n    }\n\n    const battFill = Math.round((soc / 100) * 10);\n    const socColor = soc > 30 ? 'var(--text-primary)' : soc > 12 ? 'var(--signal-caution)' : 'var(--signal-critical)';\n    const battBars = Array.from({ length: 10 }, (_, i) => ({\n      c: i < battFill\n        ? (s.charging ? 'var(--energy-regen)' : soc > 55 ? 'var(--energy-full)' : soc > 30 ? 'var(--energy-mid)' : soc > 12 ? 'var(--energy-low)' : 'var(--energy-empty)')\n        : 'var(--track-empty)',\n    }));\n\n    const dotC = (v) => (v === view ? 'var(--current-500)' : 'var(--line-strong)');\n\n    return {\n      theme, view, preset: s.preset, units: s.units, mode: s.mode, ble: s.ble,\n      isRide: view === 'ride', isTrip: view === 'trip', isDtc: view === 'dtc',\n      isSetup: view === 'setup', isCharge: view === 'charge',\n      hitMin: five ? 48 : 44, hitGloved: five ? 56 : 48,\n      bezelPad: five ? 16 : 26, lampSize: five ? 22 : 20, statIcon: 20,\n      presetNote: five\n        ? '5.0 in · 800×480 · 188 ppi · 8 px safe area ≈ 1.1 mm · min target 56 px ≈ 7.6 mm'\n        : '7.0 in · 800×480 · 133 ppi · 8 px safe area ≈ 1.5 mm · min target 48 px ≈ 9.2 mm',\n      presetOptions: [{ value: '5', label: '5 in' }, { value: '7', label: '7 in' }],\n      themeOptions: [{ value: 'auto', label: 'Auto' }, { value: 'night', label: 'Night' }, { value: 'day', label: 'Day' }],\n      motionOptions: [{ value: 'full', label: 'Motion full' }, { value: 'lite', label: 'Motion lite' }],\n      unitOptions: [{ value: 'metric', label: 'km/h · km' }, { value: 'imperial', label: 'mph · mi' }],\n      motion: s.motion, themeMode: s.themeMode,\n      speedInt: Math.round(shown),\n      speedFont: Math.round(shown) >= 100 ? '190px' : '250px',\n      anyAlert: tempWarn || fault, tempTextOnly: tempWarn && !fault,\n      speedUnit: metric ? 'km/h' : 'mph',\n      distUnit: metric ? 'km' : 'mi',\n      speedColor: fault ? 'var(--signal-caution)' : 'var(--text-primary)',\n      glow: full ? (0.1 + 0.9 * Math.min(1, shown / (metric ? 120 : 75))).toFixed(2) : '0',\n      flowCells, battBars, socColor,\n      dotC0: dotC('ride'), dotC1: dotC('trip'), dotC2: dotC('dtc'), dotC3: dotC('setup'),\n      goRide: this.goRide, goTrip: this.goTrip, goDtc: this.goDtc, goSetup: this.goSetup,\n      regenValue: kw < 0 ? Math.abs(kw).toFixed(1) + ' kW' : '',\n      powerValue: kw >= 0 ? kw.toFixed(1) + ' kW' : '',\n      regenLabelColor: kw < 0 ? 'var(--energy-regen)' : 'var(--text-tertiary)',\n      powerLabelColor: kw > 0 ? 'var(--signal-caution)' : 'var(--text-tertiary)',\n      soc, range: metric ? rangeKm : Math.round(toMi(rangeKm)),\n      tripDist: (metric ? s.tripKm : toMi(s.tripKm)).toFixed(1),\n      odo: metric ? '12\\u2009840' : '7\\u2009979',\n      packV: (88.4 + soc * 0.102).toFixed(1),\n      motorTemp: s.motorTemp, ctrlTemp: s.ctrlTemp,\n      motorColor: s.motorTemp > 95 ? 'var(--signal-caution)' : 'var(--text-primary)',\n      tempTone: s.motorTemp > 95 ? 'accent' : undefined,\n      tempWarn, battWarn: soc < 12, fault,\n      absActive: fault,\n      lampTurnL: lampState(s.blinker === 'left', '62,210,107', true),\n      lampTurnR: lampState(s.blinker === 'right', '62,210,107', true),\n      lampBeam: lampState(theme === 'night', '59,130,246'),\n      lampAbs: lampState(fault, '255,176,32'),\n      lampBle: lampState(s.ble, '0,229,208'),\n      lampMil: lampState(fault, '255,68,56'),\n      turnLeft: s.blinker === 'left', turnRight: s.blinker === 'right',\n      highBeam: theme === 'night',\n      statusLabel: s.charging ? 'Charging' : fault ? 'Limited' : 'Ready',\n      statusColor: fault ? 'var(--signal-caution)' : 'var(--signal-go)',\n      clock: String(hour).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0'),\n      airTemp: 18,\n      chargeEta: soc >= 99 ? 'Ready' : Math.floor((100 - soc) * 1.6 / 60) + ':' + String(Math.round((100 - soc) * 1.6 % 60)).padStart(2, '0'),\n      modeLabel: { eco: 'Eco', city: 'City', sport: 'Sport' }[s.mode],\n      cycleMode: () => this.setState((x) => ({ mode: { eco: 'city', city: 'sport', sport: 'eco' }[x.mode] })),\n      bleTone: s.ble ? 'accent' : 'neutral',\n      bleLabel: s.ble ? 'Linked' : 'Off',\n      bleDetail: s.ble ? 'Connected · −54 dBm' : 'Not connected · pairing open 60 s',\n      bleAction: s.ble ? 'Disconnect' : 'Pair',\n      brightness: s.brightness, regen: s.regen,\n      autoTheme: s.autoTheme, autoLight: s.autoLight,\n      brMin: 10, brMax: 100, brStep: 5, zero: 0, one: 1, regenMax: 3,\n      showLvglMap: this.props.showLvglMap ?? true,\n      simTone: s.sim ? 'primary' : 'secondary',\n      faultTone: fault ? 'critical' : 'secondary',\n      chargeTone: s.charging ? 'primary' : 'secondary',\n      durBase: full ? '260ms' : '0ms',\n      durSlow: full ? '400ms' : '0ms',\n      durMotion: full ? '250ms' : '0ms',\n      setPreset: this.set('preset'), setThemeMode: this.set('themeMode'), setUnits: this.set('units'),\n      setMotion: this.set('motion'), setBrightness: this.set('brightness'), setRegen: this.set('regen'),\n      setAutoTheme: this.set('autoTheme'), setAutoLight: this.set('autoLight'),\n      onDown: (e) => { this.dragX = e.clientX; },\n      onUp: (e) => {\n        if (this.dragX == null) return;\n        const dx = e.clientX - this.dragX;\n        this.dragX = null;\n        if (Math.abs(dx) > 40) this.page(dx < 0 ? 1 : -1);\n      },\n      onWheel: (e) => {\n        if (Math.abs(e.deltaX) < 12) return;\n        const nowT = Date.now();\n        if (this.lastWheel && nowT - this.lastWheel < 420) return;\n        this.lastWheel = nowT;\n        this.page(e.deltaX > 0 ? 1 : -1);\n      },\n      onKey: (e) => {\n        if (e.key === 'ArrowRight') this.page(1);\n        if (e.key === 'ArrowLeft') this.page(-1);\n      },\n      toggleSim: () => this.setState((x) => ({ sim: !x.sim })),\n      toggleFault: () => this.setState((x) => ({ fault: !x.fault })),\n      toggleCharging: () => this.setState((x) => ({ charging: !x.charging })),\n      toggleBle: () => this.setState((x) => ({ ble: !x.ble })),\n      resetTrip: () => this.setState({ tripKm: 0 }),\n      true: true, false: false,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
